<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Hintergrund-Gradient (ODAS-Standard) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7eb8f7"/>
      <stop offset="100%" stop-color="#3d3fa5"/>
    </linearGradient>
    <!-- Schatten-Filter (ODAS-Standard) -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- Hintergrund: Abgerundetes Quadrat rx=108, ry=108 -->
  <rect width="512" height="512" rx="108" ry="108" fill="url(#bgGrad)"/>

  <!-- Glanz-Overlay oben-links für Tiefenwirkung -->
  <ellipse cx="160" cy="140" rx="180" ry="160" fill="#ffffff" fill-opacity="0.08"/>

  <!-- Motiv: Stilisierte Sehenswürdigkeit / Schloss / Landmarke -->
  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Fundament / Sockel -->
    <rect x="96" y="388" width="320" height="18" rx="9" fill="#ffffff" fill-opacity="0.95"/>

    <!-- Hauptmauerwerk Basis -->
    <path d="M 126 388 L 126 250 L 196 250 L 196 388 Z" fill="#ffffff"/>
    <path d="M 316 388 L 316 250 L 386 250 L 386 388 Z" fill="#ffffff"/>
    
    <!-- Zentraler Baukörper mit Rundbogentor -->
    <path d="M 196 388 L 196 220 L 316 220 L 316 388 L 290 388 L 290 330 C 290 310 275 295 256 295 C 237 295 222 310 222 330 L 222 388 Z" fill="#ffffff"/>

    <!-- Wehrmauer-Zinnen (Mitte) -->
    <rect x="206" y="208" width="16" height="14" rx="2" fill="#ffffff"/>
    <rect x="230" y="208" width="16" height="14" rx="2" fill="#ffffff"/>
    <rect x="266" y="208" width="16" height="14" rx="2" fill="#ffffff"/>
    <rect x="290" y="208" width="16" height="14" rx="2" fill="#ffffff"/>

    <!-- Zentraler Hauptturm -->
    <rect x="224" y="160" width="64" height="50" rx="2" fill="#ffffff"/>

    <!-- Zinnen Hauptturm -->
    <rect x="220" y="148" width="18" height="14" rx="2" fill="#ffffff"/>
    <rect x="247" y="148" width="18" height="14" rx="2" fill="#ffffff"/>
    <rect x="274" y="148" width="18" height="14" rx="2" fill="#ffffff"/>

    <!-- Hauptturm-Spitze & Fahne -->
    <polygon points="256,92 232,148 280,148" fill="#ffffff"/>
    <line x1="256" y1="92" x2="256" y2="72" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <polygon points="256,74 278,82 256,90" fill="#ffffff"/>

    <!-- Linker Flankenturm -->
    <rect x="116" y="200" width="60" height="60" rx="3" fill="#ffffff"/>
    <!-- Linke Zinnen -->
    <rect x="112" y="188" width="16" height="14" rx="2" fill="#ffffff"/>
    <rect x="138" y="188" width="16" height="14" rx="2" fill="#ffffff"/>
    <rect x="164" y="188" width="16" height="14" rx="2" fill="#ffffff"/>
    <!-- Linke Turmspitze -->
    <polygon points="146,128 122,188 170,188" fill="#ffffff"/>
    <circle cx="146" cy="124" r="3.5" fill="#ffffff"/>

    <!-- Rechter Flankenturm -->
    <rect x="336" y="200" width="60" height="60" rx="3" fill="#ffffff"/>
    <!-- Rechte Zinnen -->
    <rect x="332" y="188" width="16" height="14" rx="2" fill="#ffffff"/>
    <rect x="358" y="188" width="16" height="14" rx="2" fill="#ffffff"/>
    <rect x="384" y="188" width="16" height="14" rx="2" fill="#ffffff"/>
    <!-- Rechte Turmspitze -->
    <polygon points="366,128 342,188 390,188" fill="#ffffff"/>
    <circle cx="366" cy="124" r="3.5" fill="#ffffff"/>

    <!-- Arched Portal Inner Contour (Translucent fill for visual depth) -->
    <path d="M 228 388 L 228 332 C 228 316 240 304 256 304 C 272 304 284 316 284 332 L 284 388 Z" fill="#3d3fa5" fill-opacity="0.32"/>

    <!-- Rundbogen-Fenster Hauptturm -->
    <path d="M 244 196 L 244 182 C 244 177 248 173 252 173 C 256 173 260 177 260 182 L 260 196 Z" fill="#3d3fa5" fill-opacity="0.35"/>

    <!-- Rundbogen-Fenster Seitentürme -->
    <path d="M 140 236 L 140 224 C 140 220 143 217 146 217 C 149 217 152 220 152 224 L 152 236 Z" fill="#3d3fa5" fill-opacity="0.35"/>
    <path d="M 360 236 L 360 224 C 360 220 363 217 366 217 C 369 217 372 220 372 224 L 372 236 Z" fill="#3d3fa5" fill-opacity="0.35"/>

    <!-- Schießscharten in Basis -->
    <rect x="156" y="295" width="8" height="24" rx="3" fill="#3d3fa5" fill-opacity="0.25"/>
    <rect x="348" y="295" width="8" height="24" rx="3" fill="#3d3fa5" fill-opacity="0.25"/>
  </g>
</svg>
